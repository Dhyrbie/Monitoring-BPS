<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring Kegiatan & Sensus</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
    
    .wrapper { display: flex; width: 100%; min-height: 100vh; position: relative; }
    
    /* Sidebar Styling */
    #sidebar {
      min-width: 250px;
      max-width: 250px;
      background: #1e293b;
      color: #fff;
      transition: all 0.3s;
      position: relative;
      z-index: 1050;
    }

    #sidebar .sidebar-header {
      padding: 20px 15px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
    }

    #sidebar ul.components { padding: 15px 0; }

    #sidebar ul li a {
      padding: 12px 20px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #cbd5e1;
      text-decoration: none;
      transition: 0.2s;
    }

    #sidebar ul li a:hover, #sidebar ul li.active > a {
      color: #ffffff;
      background: #334155;
      border-left: 4px solid #3b82f6;
    }

    #content { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }

    .top-navbar {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 15px 25px;
    }

    .page-section { display: none; }
    .page-section.active { display: block; }

    /* Overlay untuk menutup sidebar saat diklik di luar pada mode HP */
    #sidebarOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5);
      z-index: 1040;
    }

    /* Media Query untuk Mobile (Layar di bawah 992px / Tablet & HP) */
    @media (max-width: 991.98px) {
      #sidebar {
        position: fixed;
        top: 0;
        left: -250px; /* Sembunyikan sidebar di luar layar sebelah kiri */
        height: 100vh;
      }
      #sidebar.show-sidebar {
        left: 0; /* Munculkan sidebar saat aktif */
      }
      #sidebarOverlay.show-overlay {
        display: block;
      }
    }
  </style>

  <?!= include('DashboardCSS'); ?>
  <?!= include('FormProgressCSS'); ?>
</head>
<body>

<div class="wrapper">
  <!-- OVERLAY GELAP SAAT SIDEBAR MUNCUL DI HP -->
  <div id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- SIDEBAR MENU -->
  <nav id="sidebar">
    <div class="sidebar-header d-flex justify-content-between align-items-center">
      <div>
        <h6 class="fw-bold mb-0 text-white"><i class="fa-solid fa-chart-line me-2"></i>MONITORING BPS</h6>
        <small class="text-muted">Kota Bekasi</small>
      </div>
      <!-- Tombol Close (X) khusus tampilan mobile di dalam header sidebar -->
      <button class="btn btn-sm text-white d-lg-none" onclick="toggleSidebar()">
        <i class="fa-solid fa-xmark fs-5"></i>
      </button>
    </div>

    <ul class="list-unstyled components">
      <li class="active" id="nav-dashboard">
        <a href="javascript:void(0)" onclick="switchPage('dashboard')">
          <i class="fa-solid fa-house"></i> Dashboard
        </a>
      </li>
      <li id="nav-progress">
        <a href="javascript:void(0)" onclick="switchPage('progress')">
          <i class="fa-solid fa-list-check"></i> Form Progress
        </a>
      </li>
      <li id="nav-admin">
        <a href="javascript:void(0)" onclick="switchPage('admin')">
          <i class="fa-solid fa-user-plus"></i> Tambah Tugas
        </a>
      </li>
    </ul>
  </nav>

  <!-- HALAMAN UTAMA -->
  <div id="content">
    <div class="top-navbar d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <!-- Tombol Hamburger (Garis Tiga) khusus HP -->
        <button class="btn btn-outline-secondary d-lg-none px-2 py-1" onclick="toggleSidebar()">
          <i class="fa-solid fa-bars fs-5"></i>
        </button>
        <h5 class="fw-bold text-dark mb-0 fs-6 fs-md-5" id="pageTitle">Dashboard Utama</h5>
      </div>
      <span class="badge bg-primary px-3 py-2">BPS Bekasi</span>
    </div>

    <div class="p-3 p-md-4">
      <div id="section-dashboard" class="page-section active">
        <?!= include('Dashboard'); ?>
      </div>

      <div id="section-progress" class="page-section">
        <?!= include('FormProgress'); ?>
      </div>

      <div id="section-admin" class="page-section">
        <?!= include('FormAdmin'); ?>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<?!= include('DashboardJS'); ?>
<?!= include('FormProgressJS'); ?>
<?!= include('FormAdminJS'); ?>

<script>
  window.addEventListener('DOMContentLoaded', function() {
    initDashboard();
    initFormProgress();
  });

  // Fungsi Buka-Tutup Sidebar untuk Mobile
  function toggleSidebar() {
    let sidebar = document.getElementById('sidebar');
    let overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.toggle('show-sidebar');
    overlay.classList.toggle('show-overlay');
  }

  function switchPage(pageName) {
    document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('#sidebar ul li').forEach(el => el.classList.remove('active'));

    if (pageName === 'dashboard') {
      document.getElementById('section-dashboard').classList.add('active');
      document.getElementById('nav-dashboard').classList.add('active');
      document.getElementById('pageTitle').innerText = "Dashboard Monitoring & Kinerja";
      if (typeof loadDashboardData === 'function') loadDashboardData();
    } 
    else if (pageName === 'progress') {
      document.getElementById('section-progress').classList.add('active');
      document.getElementById('nav-progress').classList.add('active');
      document.getElementById('pageTitle').innerText = "Form Realisasi Progress PPL / PML";
      if (typeof initFormProgress === 'function') initFormProgress();
    } 
    else if (pageName === 'admin') {
      document.getElementById('section-admin').classList.add('active');
      document.getElementById('nav-admin').classList.add('active');
      document.getElementById('pageTitle').innerText = "Input Penugasan NKS Baru (Admin)";
    }

    // Jika di HP, otomatis tutup sidebar setelah menu diklik
    if (window.innerWidth < 992) {
      toggleSidebar();
    }
  }
</script>

</body>
</html>
